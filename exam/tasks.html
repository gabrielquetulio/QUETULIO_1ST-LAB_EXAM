<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Student Task Manager — Student Task Manager</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="style.css" rel="stylesheet">
</head>
<body>

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-task">
  <div class="container">
    <a class="navbar-brand" href="index.html">◐ Student Task Manager</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-2">
        <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
        <li class="nav-item"><a class="nav-link active" href="tasks.html">My Tasks</a></li>
        <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        <li class="nav-item ms-lg-2">
          <button class="theme-toggle-btn" id="themeToggle" title="Toggle dark mode">🌙</button>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container">

  <div class="page-header-task">
    <h2 class="display-serif">My Tasks</h2>
    <p style="color: var(--ink-soft);">Add a Task, Manage how often you do it, and check it off as you go.</p>
  </div>

  <!-- Add Task Form -->
  <div class="add-task-card mb-4">
    <form id="taskForm" novalidate>
      <div class="row g-2 align-items-start">
        <div class="col-md-4">
          <input type="text" class="form-control" id="taskTitle" placeholder="Task name (e.g. Read 10 pages)">
          <div class="invalid-feedback" id="titleError">Task name is required.</div>
        </div>
        <div class="col-md-3">
          <input type="date" class="form-control" id="taskDate">
          <div class="invalid-feedback" id="dateError">Start date is required.</div>
        </div>
        <div class="col-md-3">
          <select class="form-select" id="taskFrequency">
            <option value="Daily">Daily</option>
            <option value="Weekly">Weekly</option>
            <option value="Monthly">Monthly</option>
          </select>
        </div>
        <div class="col-md-2 d-grid">
          <button type="submit" class="btn btn-plum">Add Task</button>
        </div>
      </div>
    </form>
  </div>

  <!-- Stat chips -->
  <div class="row g-3 mb-4">
    <div class="col-sm-4">
      <div class="stat-chip">
        <span style="font-size:1.4rem;">📋</span>
        <div>
          <div class="stat-number" id="statTotal">0</div>
          <div class="stat-label">Total Tasks</div>
        </div>
      </div>
    </div>
    <div class="col-sm-4">
      <div class="stat-chip">
        <span style="font-size:1.4rem;">⏳</span>
        <div>
          <div class="stat-number" id="statPending">0</div>
          <div class="stat-label">Still To Do</div>
        </div>
      </div>
    </div>
    <div class="col-sm-4">
      <div class="stat-chip">
        <span style="font-size:1.4rem;">✅</span>
        <div>
          <div class="stat-number" id="statDone">0</div>
          <div class="stat-label">Completed</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Search + Clear All -->
  <div class="d-flex gap-2 mb-3">
    <input type="text" class="form-control" id="searchBox" placeholder="Search tasks...">
    <button class="btn btn-outline-danger text-nowrap" id="clearAllBtn">Clear All</button>
  </div>

  <!-- Task list -->
  <div id="taskList" class="mb-5"></div>

</div>

<!-- Edit Modal -->
<div class="modal fade" id="editModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Edit Task</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editId">
        <div class="mb-3">
          <label class="form-label">Task name</label>
          <input type="text" class="form-control" id="editTitle">
        </div>
        <div class="mb-3">
          <label class="form-label">Start date</label>
          <input type="date" class="form-control" id="editDate">
        </div>
        <div class="mb-3">
          <label class="form-label">Frequency</label>
          <select class="form-select" id="editFrequency">
            <option value="Daily">Daily</option>
            <option value="Weekly">Weekly</option>
            <option value="Monthly">Monthly</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-plum" id="saveEditBtn">Save Changes</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="script.js"></script>
</body>
</html>
